# Sends the resolved Gradle dependency graph to GitHub so Dependabot can alert on
# it. GitHub can't read this build on its own (Kotlin DSL, version catalog,
# lockfiles), so without this job Dependabot sees no dependencies at all.
name: Dependency submission

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  submit:
    runs-on: ubuntu-latest
    permissions:
      contents: write # required by the Dependency Submission API
    steps:
      # Actions are pinned to commit SHAs so a moved tag can't change what runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # No Gradle wrapper in the repo; same version as docker/Dockerfile.
          gradle-version: "8.11.1"
          dependency-graph: generate-and-submit
